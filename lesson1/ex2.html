<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ร้านกาแฟ</title>
</head>
<body>
    <h1>ร้านกาแฟ</h1>

    <!-- 1. รูปโลโก้ กำหนด width="200" มี src และ alt -->
    <img src="logo.png" alt="โลโก้ร้านกาแฟ" width="200">

    <!-- 2. รูปบรรยากาศร้าน มี src และ alt -->
    <img src="coffee.jpg" alt="บรรยากาศร้านกาแฟ">

    <!-- 3. ลิงก์ไปหน้าเมนู menu.html -->
    <a href="menu.html">ดูเมนูอาหารและเครื่องดื่ม</a>

    <!-- 4. ลิงก์ภายนอก ขึ้นต้นด้วย https:// และเปิดแท็บใหม่ (target="_blank") -->
    <a href="https://www.google.com" target="_blank">ไปยังเว็บไซต์ภายนอก</a>
</body>
</html>
