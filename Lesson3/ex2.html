<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
<nav aria-label="เมนูหลัก" style="margin:16px 0;padding:12px 16px;background:#101a35;border:1px solid #28eaff;border-radius:10px;font-family:Arial,sans-serif"><a href="../index.html" style="color:#28eaff;text-decoration:none;font-weight:bold">← กลับหน้าแรก (Home)</a></nav>

  <p>ราคา <span id="price">45</span> บาท</p>
<input id="qty" value="3">
<p id="total"></p>

<script>
    const price = Number(document.getElementById("price").textContent);   // 45
    const qty   = Number(document.getElementById("qty").value);           // 3

    document.getElementById("total").textContent = "รวม " + (price * qty) + " บาท";
    // หน้าเว็บขึ้นว่า: รวม 135 บาท
</script>
</body>
</html>
