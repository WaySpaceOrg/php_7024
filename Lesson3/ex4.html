<body>
<nav aria-label="เมนูหลัก" style="margin:16px 0;padding:12px 16px;background:#101a35;border:1px solid #28eaff;border-radius:10px;font-family:Arial,sans-serif"><a href="../index.html" style="color:#28eaff;text-decoration:none;font-weight:bold">← กลับหน้าแรก (Home)</a></nav>

    <button id="shake">เขย่าเซียมซี</button>
<p id="fortune"></p>

<script>
    const fortunes = ["โชคดีมาก", "โชคดี", "เฉยๆ", "ระวังตัว", "รอก่อน"];

    document.getElementById("shake").addEventListener("click", function () {
        const i = Math.floor(Math.random() * fortunes.length);   // 0–4
        document.getElementById("fortune").textContent = "ใบที่ " + (i + 1) + ": " + fortunes[i];
    });

    // สลับโหมดกลางคืน
    // document.body.classList.toggle("dark");
</script>
</body>
</html>
