<figure style="margin:0 0 24px"><img src="https://images.unsplash.com/photo-1538805060514-97d9cc17730c?auto=format&fit=crop&w=1200&q=85" alt="ผู้หญิงกำลังออกกำลังกาย" loading="lazy" style="display:block;width:100%;max-height:260px;object-fit:cover;border:1px solid #28eaff66;border-radius:14px"><figcaption style="color:#aab8d5;font-size:.9rem;margin-top:8px">เครื่องคำนวณ BMI และสุขภาพ</figcaption></figure>
<h1>เครื่องคิด BMI</h1>
    <p>น้ำหนัก (กก.) <input id="weight"></p>
    <p>ส่วนสูง (ซม.) <input id="height"></p>
    <button id="calc">คำนวณ</button>
    <p id="result"></p>

    <script>
        // เมื่อกดปุ่ม: อ่านค่า → คำนวณ → แสดงผลใน #result
        document.getElementById("calc").addEventListener("click", function () {
            const weight = Number(document.getElementById("weight").value);
            const heightCm = Number(document.getElementById("height").value);
            const result = document.getElementById("result");

            if (!weight || !heightCm) {
                result.textContent = "กรุณากรอกน้ำหนักและส่วนสูง";
                return;
            }

            const heightM = heightCm / 100;
            const bmi = weight / (heightM * heightM);

            let group;
            if (bmi < 18.5) {
                group = "น้ำหนักน้อย";
            } else if (bmi < 25) {
                group = "ปกติ";
            } else {
                group = "น้ำหนักเกิน";
            }

            result.textContent = "BMI " + bmi.toFixed(1) + " (" + group + ")";
        });
    </script></section></main><footer>© 2026 WaySpaceOrg · PHP_7024 · CyberPhuk Learning Hub</footer></body></html>
