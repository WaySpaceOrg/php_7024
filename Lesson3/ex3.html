<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<nav aria-label="เมนูหลัก" style="margin:16px 0;padding:12px 16px;background:#101a35;border:1px solid #28eaff;border-radius:10px;font-family:Arial,sans-serif"><a href="../index.html" style="color:#28eaff;text-decoration:none;font-weight:bold">← กลับหน้าแรก (Home)</a></nav>

    <button id="like">❤️ ถูกใจ</button>
<span id="count">0</span>

<script>
    let likes = 0;
    const btn = document.getElementById("like");

    btn.addEventListener("click", function () {
        likes = likes + 1;
        document.getElementById("count").textContent = likes;

        if (likes >= 10) {
            console.log("ยอดนิยมแล้ว!");
        } else {
            console.log("อีก " + (10 - likes) + " ครั้ง");
        }
    });
</script>
</body>
</html>
